buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = "${addon_version}"
group = 'com.cheaptrick.addon'
archivesBaseName = 'CheapTrickAddon-1.16.5'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
minecraft {
    // Как и в шаблоне аддона RotP: official-маппинги, Forge 1.16.5-36.2.34
    mappings channel: 'official', version: '1.16.5'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { cheaptrickaddon { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { cheaptrickaddon { source sourceSets.main } }
        }
    }
}

repositories {
    // 1) локальный JAR Ripples of the Past в ./libs
    flatDir { dirs 'libs' }
    // 2) maven мода (как в шаблоне аддона)
    maven {
        name "RotP Maven"
        url 'https://raw.githubusercontent.com/StandoByte/RotP-maven/main'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.34'

    implementation fg.deobf("standobyte.jojo:JJBA-RipplesOfThePast:${main_mod_version}")
    compileOnly 'team.unnamed:mocha:3.0.0'
}

jar {
    manifest {
        attributes([
            "Specification-Title": "cheaptrickaddon",
            "Specification-Vendor": "cheaptrick",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor": "cheaptrick",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.2'
}
test {
    useJUnitPlatform()
}
